name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  shell-lint:
    name: Shell lint (smoke-test.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check (bash -n)
        run: |
          bash -n scripts/smoke-test.sh
          bash -n scripts/smoke-test.test.sh
      - name: ShellCheck
        run: shellcheck scripts/smoke-test.sh scripts/smoke-test.test.sh
      - name: Run smoke-test.sh regression test
        run: bash scripts/smoke-test.test.sh

  # `cargo xtask ci` is exactly what contributors run locally (CONTRIBUTING.md):
  # fmt --check, clippy, test (+ --all-features), contract wasm, conformance.
  xtask-ci:
    name: cargo xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Installs the exact toolchain + components pinned in rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ci
      - name: Check README contract tables
        if: runner.os == 'Linux'
        run: python .github/scripts/check_readme_contracts.py

  # Reproducibility (docs/releasing.md#reproducible-builds): the same commit
  # built in the pinned container and natively, on different runners and
  # checkout paths, must give byte-identical wasm.
  wasm-reproducible:
    name: Reproducible wasm (${{ matrix.mode }})
    strategy:
      matrix:
        mode: [container, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ${{ matrix.mode == 'native' && 'second build/lafiya' || '.' }}
      - name: Build in pinned container
        if: matrix.mode == 'container'
        run: make wasm-reproducible
      - name: Build natively in a different directory
        if: matrix.mode == 'native'
        working-directory: second build/lafiya
        run: |
          rustup toolchain install
          cargo xtask wasm --reproducible
          sha256sum target/wasm32v1-none/release/*.wasm | tee target/wasm32v1-none/release/SHA256SUMS
      - name: Assert provenance metadata
        working-directory: ${{ matrix.mode == 'native' && 'second build/lafiya' || '.' }}
        run: python3 scripts/check_wasm_meta.py --commit "$(git rev-parse HEAD)" target/wasm32v1-none/release/*.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: sha256sums-${{ matrix.mode }}
          path: ${{ matrix.mode == 'native' && 'second build/lafiya/' || '' }}target/wasm32v1-none/release/SHA256SUMS

  wasm-reproducible-compare:
    name: Reproducible wasm (compare)
    needs: wasm-reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
      - name: Compare SHA-256 of both builds
        run: diff -u sha256sums-container/SHA256SUMS sha256sums-native/SHA256SUMS

  fuzz:
    name: Fuzz (proptest, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask fuzz
